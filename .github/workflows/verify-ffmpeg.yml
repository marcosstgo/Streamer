name: Verify FFmpeg Checksums

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify FFmpeg checksums
        shell: pwsh
        run: |
          Write-Host "Running verify-ffmpeg.ps1"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify-ffmpeg.ps1
