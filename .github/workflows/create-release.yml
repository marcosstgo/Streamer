name: Create Release Draft

on:
  push:
    tags:
      - 'v*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section for tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Looking for changelog section for tag: $TAG"
          # Extract section starting with "## [TAG]" until next "## [" or EOF
          awk "/^## \[$TAG\]/ {show=1; next} /^## \[/ && show{exit} show{print}" CHANGELOG.md > release_notes.txt || true
          if [ ! -s release_notes.txt ]; then
            # Fallback: use entire CHANGELOG
            cat CHANGELOG.md > release_notes.txt
          fi
          # sanitize for YAML by preserving as-is
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release (draft)
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
