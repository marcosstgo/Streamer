name: Create Release Draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI auth
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh auth status

      - name: Extract changelog section for tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Looking for changelog section for tag: $TAG"
          # Extract section starting with "## [TAG]" until next "## [" or EOF
          awk "/^## \[$TAG\]/ {show=1; next} /^## \[/ && show{exit} show{print}" CHANGELOG.md > release_notes.txt || true
          if [ ! -s release_notes.txt ]; then
            # Fallback: use entire CHANGELOG
            cat CHANGELOG.md > release_notes.txt
          fi
          # sanitize for YAML by preserving as-is
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Skip if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release draft
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "$RELEASE_BODY"

  build_and_upload_asset:
    runs-on: windows-latest
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish "Streamer/Streamer.csproj" /p:PublishProfile="Properties\PublishProfiles\Release-win-x64.pubxml"

      - name: Upload release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "Streamer\bin\Release\publish-selfcontained\Streamer Pro.exe#Streamer.Pro.exe" --clobber --repo "${{ github.repository }}"
